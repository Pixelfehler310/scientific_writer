    approved_by: Simon Sucker
    note: 'G1 freigegeben. Bestätigt sind: allgemeine Indexset-Auswahlmethodik als
      Hauptgegenstand mit E-Commerce-Fallstudie; die formulierte Hauptforschungsfrage;
      Q1 bis Q3; I1 bis I8 als vorläufiger optionaler Kandidatenpool und I9 als verpflichtender
      Unique-Integritätsindex; Gleichgewichtung der Query Shapes in der Fallstudie
      bei optionalen Nutzergewichten im Werkzeug; Einzelindexmessungen nur als Screening-Modell
      mit Strukturmetriken zur Kontrolle; Pareto-Auswahl ohne willkürliche Gesamtstrafe;
      höchstens drei isoliert und ohne hint validierte Finalisten; sowie die Begrenzung
      aller Aussagen auf Workload, Kandidatenraum, Daten, Messumgebung und Kostenmodell.
      Messergebnisse werden zunächst je Skalierung und Selektivitätsvariante getrennt
      ausgewertet; die Aggregations- und Robustheitsregel wird in G2 festgelegt. Der
      Evaluator verarbeitet konfigurierte, registrierte ausführbare Query Shapes und
      ist kein Parser für beliebige MongoDB-Abfragen.'
  G2:
    status: approved
    approved_at: '2026-07-31T21:49:52.681976+00:00'
    approved_by: Simon Sucker
    note: G2 freigegeben. Bestätigt sind das neu aufgebaute Scoping, die Argumentationslinie,
      die Fünf-Kapitel-Gliederung und das Wortbudget von 4.500 Wörtern. Methodisch
      freigegeben sind insbesondere die Basiskonfiguration aus _id und I9, acht optionale
      Kandidaten mit vollständiger Enumeration von 256 Sets, baseline-normalisierte
      Read-Kosten und getrennte Pareto-Fronten je Skalierung, additive Speicher- und
      Write-Proxys ausschließlich für das Screening, die physische Finalvalidierung
      ohne hint sowie ein primäres 10-Prozent-Read-Band mit Sensitivitätsanalysen
      bei 5 und 20 Prozent. Freigegeben sind außerdem die verständlich überarbeitete
      Hauptforschungsfrage und die vier Teilfragen. G3 wird in einem neuen Chat bearbeitet.
